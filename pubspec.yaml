name: ytdlp_flutter
description: yt-dlp対応サイトの動画・音声をMP4、MKV、MP3、WAVで保存するAndroidアプリ。
publish_to: none
version: 1.0.3+4
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.4
  flutter_markdown_plus: 1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
